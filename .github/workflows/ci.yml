name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run the macOS and Windows build jobs regardless of changed paths
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-ci.yml@050fceee3a68333719a15db6dd09d6c8a6a85c59
    with:
      product_name: TeethMatrix
      product_slug: teethmatrix
      cmake_option_prefix: TEETHMATRIX
      debug_targets_json: '["teethmatrix_engine_tests","teethmatrix_plugin_bridge_tests","teethmatrix_standalone_bridge_tests"]'
      release_test_targets_json: '["teethmatrix_engine_tests","teethmatrix_plugin_bridge_tests","teethmatrix_standalone_bridge_tests"]'
      windows_debug_plugins: true
